# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Input method
# exec-once = fcitx5

# Let Hyprland handle the physical power button instead of logind powering off immediately.
exec-once = systemd-inhibit --what=handle-power-key --who=Hyprland --why='Open the session menu from the power key' --mode=block sleep infinity
