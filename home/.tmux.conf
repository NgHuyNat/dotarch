# ==========================================
# 1. CẤU HÌNH CƠ BẢN
# ==========================================

# Đổi Prefix từ Ctrl+b sang Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Bật hỗ trợ chuột
set -g mouse on

# Đánh số thứ tự Tab (Window) và Ô (Pane) từ 1
set -g base-index 1
setw -g pane-base-index 1

# Ép dùng chế độ phím Vi để bôi đen/di chuyển giống Vim
setw -g mode-keys vi

# ==========================================
# 2. QUẢN LÝ PLUGIN
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# Cấu hình tự động khôi phục session
set -g @continuum-restore 'on'

# Tinh chỉnh giao diện Dracula
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-left-icon session

# ==========================================
# 3. MÀU SẮC & SHELL (Arch Linux + Kitty)
# ==========================================

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-kitty:RGB"
set-option -g default-shell /usr/bin/zsh

# ==========================================
# 4. KHỞI CHẠY TPM & FIX BÔI ĐEN (QUAN TRỌNG)
# ==========================================

# Chạy TPM
run '~/.tmux/plugins/tpm/tpm'

# --- CÁC DÒNG DƯỚI ĐÂY PHẢI ĐỂ SAU DÒNG RUN TPM ĐỂ KHÔNG BỊ GHI ĐÈ ---

# Bôi đen xong nhả chuột: Vệt vàng GIỮ NGUYÊN, tự động copy vào Clipboard Wayland
# (Yêu cầu đã cài: sudo pacman -S wl-clipboard)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

# Nhấn chuột trái ra chỗ khác để xóa vệt vàng (giống trình duyệt)
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

